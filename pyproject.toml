# pyproject.toml

[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nemobi"
version = "2.0.0"
description = "Nemobi (Normalisation des enquêtes mobilités): a tool to standardize French mobility survey datasets (EMC², EGT, EMP, etc.) into a unified format."
readme = "README.md"
authors = [{ name = "Lucas Javaudin", email = "lucas@lucasjavaudin.com" }]
license = "MIT"
license-files = ["LICENSE.md"]
classifiers = [
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Topic :: File Formats",
]
keywords = ["mobility survey", "travel survey", "France", "polars", "data format"]
dependencies = [
    "geopandas>=1.0.1",
    "humanize>=4.13.0",
    "loguru>=0.7.3",
    "pandas>=2.2.3",
    "platformdirs>=4.3.8",
    "polars[calamine]>=2.0.0",
    "py7zr>=1.1.0",
    "pyarrow>=19.0.1",
    "requests>=2.32.3",
    "tqdm>=4.67.3",
    "typer>=0.16.0",
]
requires-python = ">=3.11"

[project.scripts]
nemobi = "nemobi:cli.app"

[project.urls]
Homepage = "https://github.com/LucasJavaudin/Nemobi"
Documentation = "https://nemobi.lucasjavaudin.com/index.html"
Repository = "https://github.com/LucasJavaudin/Nemobi"
Issues = "https://github.com/LucasJavaudin/Nemobi/issues"

[dependency-groups]
dev = [
    "Cartopy>=0.24.1",
    "folium>=0.20.0",
    "ipython>=8.37.0",
    "matplotlib>=3.10.1",
    "pytest>=9.0.2",
    "ruff>=0.16.4",
    "seaborn>=0.13.2",
    "ty>=0.0.15",
]

[tool.ruff]
line-length = 100
extend-exclude = ["*.md"]

[tool.ruff.format]
skip-magic-trailing-comma = true

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "RUF", "PLW"]
ignore = [
    "C408",  # C408: allow list() and dict() calls
]
preview = false

[tool.ruff.lint.isort]
split-on-trailing-comma = false
