name: Publish mobisurvstd compatibility package
# One-off, manual workflow: publishes the final `mobisurvstd` release (legacy/mobisurvstd), a thin
# deprecated wrapper around `nemobi`. Requires a PyPI trusted publisher on the `mobisurvstd`
# project pointing to this repository, this workflow file and the `pypi-mobisurvstd` environment.
on:
  workflow_dispatch:
jobs:
  publish:
    name: Publish mobisurvstd to PyPI
    runs-on: ubuntu-latest
    environment:
      name: pypi-mobisurvstd
    permissions:
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Install uv
        uses: astral-sh/setup-uv@v6
      - name: Install Python
        run: uv python install 3.13
      - name: Build
        run: uv build legacy/mobisurvstd --out-dir dist
      - name: Publish
        run: uv publish
